name: fortad compiler matrix

on:
  merge_group:
  pull_request:

jobs:
  compiler-matrix:
    if: github.event_name == 'merge_group'
    runs-on: [self-hosted, itp-ubuntu24, itp-portable]
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@v4
        with:
          path: fortad-bench
      - name: Check out fortad
        uses: actions/checkout@v4
        with:
          repository: lazy-fortran/fortad
          path: fortad
          ref: main
      - name: Check out fortfront dependency
        uses: actions/checkout@v4
        with:
          repository: lazy-fortran/fortfront
          path: fortfront
          ref: main
      - name: Check out fortgen dependency
        uses: actions/checkout@v4
        with:
          repository: lazy-fortran/fortgen
          path: fortgen
          ref: main
      - name: Set up Intel Fortran
        uses: fortran-lang/setup-fortran@0427bcf12035acf4ad25a1eb5439c177b62ea66e
        with:
          compiler: intel
          version: '2026.1'
      - name: Set up LLVM Flang
        id: flang
        uses: fortran-lang/setup-fortran@0427bcf12035acf4ad25a1eb5439c177b62ea66e
        with:
          compiler: flang
          version: '23'
      - name: Set up NVIDIA Fortran
        uses: fortran-lang/setup-fortran@0427bcf12035acf4ad25a1eb5439c177b62ea66e
        with:
          compiler: nvidia-hpc
          version: '26.1'
      - name: Set up LFortran
        uses: fortran-lang/setup-fortran@0427bcf12035acf4ad25a1eb5439c177b62ea66e
        with:
          compiler: lfortran
          version: '0.69.0'
      - name: Expose LLVM Flang under the matrix command name
        env:
          FLANG_COMPILER: ${{ steps.flang.outputs.fc }}
        run: |
          flang_compiler_path=$(command -v "$FLANG_COMPILER")
          mkdir -p "$RUNNER_TEMP/fortad-compiler-bin"
          ln -sf "$flang_compiler_path" "$RUNNER_TEMP/fortad-compiler-bin/flang-new"
          echo "$RUNNER_TEMP/fortad-compiler-bin" >> "$GITHUB_PATH"
      - name: Set up fpm
        uses: fortran-lang/setup-fpm@a03b5f81f16417c937a31b745eeb866c5a26a7a0 # v10
        with:
          fpm-version: v0.13.0
      - name: Run required compiler matrix
        working-directory: fortad-bench
        env:
          FORTAD_REPO: ${{ github.workspace }}/fortad
          FC: gfortran
          FPM_FC: gfortran
          CC: gcc
          FPM_CC: gcc
          CXX: g++
          FPM_CXX: g++
        run: ./scripts/check_compilers.sh
