name: Tapenade full corpus contract

on:
  merge_group:

jobs:
  full-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@v4
      - name: Fetch and verify the full Tapenade corpus
        run: python3 scripts/fetch_upstreams.py --corpus tapenade
      - name: Re-run the complete offline audit
        run: python3 scripts/fetch_upstreams.py --audit-corpora
